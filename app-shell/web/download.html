<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>下载 / Download · 皓量化 · Brad Quant</title>
  <meta name="theme-color" content="#0e1117" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <style>
    :root { --bg:#0e1117; --card:#161b22; --line:#232a33; --fg:#fafafa; --sub:#9aa0aa; --red:#ef5350; }
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; background:var(--bg); color:var(--fg);
      font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 40px 20px 60px; }
    header { text-align:center; margin-bottom: 28px; }
    header img { width:76px; height:76px; border-radius:18px; }
    h1 { font-size: 24px; margin:14px 0 6px; }
    .sub { color:var(--sub); font-size:14px; line-height:1.6; }
    .grid { display:grid; grid-template-columns:1fr; gap:14px; margin-top: 26px; }
    @media(min-width:620px){ .grid{ grid-template-columns:1fr 1fr; } }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
      padding:18px 18px 20px; display:flex; flex-direction:column; }
    .card h3 { margin:0 0 4px; font-size:17px; display:flex; align-items:center; gap:8px; }
    .card p { margin:6px 0 14px; color:var(--sub); font-size:13px; line-height:1.55; flex:1; }
    .btn { display:inline-block; text-align:center; text-decoration:none; font-weight:700;
      font-size:15px; padding:11px 16px; border-radius:10px; background:var(--red); color:#fff; }
    .btn.ghost { background:transparent; border:1px solid var(--line); color:var(--fg); font-weight:600; }
    .btn + .btn { margin-top:8px; }
    .full { grid-column:1/-1; }
    .note { margin-top:26px; background:#12171d; border:1px solid var(--line);
      border-radius:12px; padding:16px 18px; color:var(--sub); font-size:12.5px; line-height:1.7; }
    .note b { color:var(--fg); }
    code { background:#0b0e12; padding:1px 6px; border-radius:5px; color:#e6b800; font-size:12px; }
    footer { text-align:center; color:var(--sub); font-size:12px; margin-top:30px; }
    a.link { color:#58a6ff; }
    .language-switcher { display:flex; justify-content:flex-end; margin-bottom:12px; }
    .language-switcher div { display:flex; padding:3px; border:1px solid var(--line);
      border-radius:999px; background:var(--card); }
    .lang-btn { border:0; border-radius:999px; padding:6px 12px; background:transparent;
      color:var(--sub); font:600 12px inherit; cursor:pointer; }
    .lang-btn.active { background:var(--red); color:#fff; }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="language-switcher" aria-label="Language"><div>
      <button class="lang-btn" type="button" data-lang="zh">中文</button>
      <button class="lang-btn" type="button" data-lang="en">EN</button>
    </div></nav>
    <header>
      <img src="icons/icon-192.png" alt="Brad Quant logo" />
      <h1>📈 皓量化 · Brad Quant</h1>
      <div class="sub" id="intro"></div>
    </header>

    <div class="grid">
      <div class="card full">
        <h3 id="web-title"></h3>
        <p id="web-copy"></p>
        <a class="btn" id="web-button" href="./"></a>
      </div>

      <div class="card">
        <h3>🪟 Windows</h3>
        <p id="windows-copy"></p>
        <a class="btn" id="windows-button" href="https://github.com/Brad-zqh/us-stock-quant/releases/latest/download/StockQuant-Windows-Setup.exe"></a>
      </div>

      <div class="card">
        <h3>🍎 macOS</h3>
        <p id="mac-copy"></p>
        <a class="btn" id="mac-button" href="https://github.com/Brad-zqh/us-stock-quant/releases/latest/download/StockQuant-macOS.dmg"></a>
      </div>

      <div class="card">
        <h3>🤖 Android</h3>
        <p id="android-copy"></p>
        <a class="btn" id="android-button" href="https://github.com/Brad-zqh/us-stock-quant/releases/latest/download/StockQuant-Android.apk"></a>
      </div>

      <div class="card">
        <h3>📱 iPhone / iPad</h3>
        <p id="ios-copy"></p>
        <a class="btn ghost" id="ios-button" href="./"></a>
      </div>
    </div>

    <div class="note" id="note"></div>

    <footer id="footer"></footer>
  </div>
  <script>
    var copy = {
      zh: {
        title: "下载 · 皓量化",
        intro: "美股 / A股多因子量化研究<br />选择设备下载<strong>最新版本</strong>。",
        webTitle: "🌐 网页版（推荐）", webCopy: "无需安装，浏览器直接使用；手机可添加到主屏幕。", webButton: "打开网页版",
        windowsCopy: "NSIS 安装包（.exe）。如出现 SmartScreen 提示，可选择“更多信息 → 仍要运行”。", windowsButton: "下载 Windows 版",
        macCopy: "通用磁盘映像（.dmg），支持 Intel 与 Apple 芯片。安装包未签名；若提示<strong>“已损坏”</strong>：<br />① 把 App 拖入“应用程序”<br />② 打开“终端”并执行：<br /><code>xattr -cr &quot;/Applications/皓量化.app&quot;</code><br />③ 双击打开，或在“系统设置 → 隐私与安全性”中选择仍要打开。", macButton: "下载 macOS 版",
        androidCopy: "调试版 APK；安装时请允许来自未知来源的应用。", androidButton: "下载 Android APK",
        iosCopy: "使用网页版：在 Safari 中选择“分享 → 添加到主屏幕”。", iosButton: "用 Safari 打开网页版",
        note: "<b>提示：</b>个人项目安装包未做代码签名，系统可能显示来源未知警告，请按上方说明操作。找不到下载时，可查看 <a class=\"link\" href=\"https://github.com/Brad-zqh/us-stock-quant/releases/latest\">最新 Release 页面</a>。",
        footer: "© 皓量化 · Brad Quant · 仅供量化研究，不构成投资建议。"
      },
      en: {
        title: "Download · Brad Quant",
        intro: "Multi-factor research for U.S. equities and China A-shares<br />Choose your platform to download the <strong>latest version</strong>.",
        webTitle: "🌐 Web App (recommended)", webCopy: "No installation required. Open it in a browser or add it to your home screen.", webButton: "Open Web App",
        windowsCopy: "NSIS installer (.exe). If SmartScreen appears, select “More info → Run anyway.”", windowsButton: "Download for Windows",
        macCopy: "Universal disk image (.dmg) for Intel and Apple silicon. The build is unsigned. If macOS says it <strong>cannot be opened</strong>:<br />1. Drag the app into Applications.<br />2. Open Terminal and run:<br /><code>xattr -cr &quot;/Applications/皓量化.app&quot;</code><br />3. Open the app, or allow it under System Settings → Privacy &amp; Security.", macButton: "Download for macOS",
        androidCopy: "Debug APK. Allow installation from unknown sources when prompted.", androidButton: "Download Android APK",
        iosCopy: "Use the Web App in Safari, then choose Share → Add to Home Screen.", iosButton: "Open Web App in Safari",
        note: "<b>Note:</b> These personal-project builds are unsigned, so your system may show an unknown-source warning. Follow the platform instructions above, or visit the <a class=\"link\" href=\"https://github.com/Brad-zqh/us-stock-quant/releases/latest\">latest GitHub Release</a>.",
        footer: "© Brad Quant · Quantitative research only · Not investment advice."
      }
    };
    var ids = ["intro", "web-title", "web-copy", "web-button", "windows-copy", "windows-button", "mac-copy", "mac-button", "android-copy", "android-button", "ios-copy", "ios-button", "note", "footer"];
    var keys = ["intro", "webTitle", "webCopy", "webButton", "windowsCopy", "windowsButton", "macCopy", "macButton", "androidCopy", "androidButton", "iosCopy", "iosButton", "note", "footer"];
    var params = new URLSearchParams(window.location.search);
    var requested = params.get("lang");
    var saved = localStorage.getItem("brad-quant-language");
    var browser = (navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en";
    function applyLanguage(next) {
      var language = next === "en" ? "en" : "zh";
      localStorage.setItem("brad-quant-language", language);
      document.documentElement.lang = language === "zh" ? "zh-CN" : "en";
      document.title = copy[language].title;
      ids.forEach(function (id, index) { document.getElementById(id).innerHTML = copy[language][keys[index]]; });
      document.getElementById("web-button").href = "./?lang=" + language;
      document.getElementById("ios-button").href = "./?lang=" + language;
      document.querySelectorAll(".lang-btn").forEach(function (button) {
        var active = button.dataset.lang === language;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", active ? "true" : "false");
      });
    }
    document.querySelectorAll(".lang-btn").forEach(function (button) {
      button.addEventListener("click", function () { applyLanguage(button.dataset.lang); });
    });
    applyLanguage(requested === "zh" || requested === "en" ? requested : (saved || browser));
  </script>
</body>
</html>
